<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地震波チェッカー：波のかけっこシミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 教育現場標準のUDフォント */
    @import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap');
    
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      font-family: 'BIZ UDPGothic', sans-serif;
      background-color: #0f172a; /* Slate-900 */
      color: #f8fafc;
      overflow: hidden; 
      overscroll-behavior: none; 
      -webkit-font-smoothing: antialiased;
    }

    /* 100dvh対応：ブラウザのUI伸縮によるレイアウト崩れを防止 */
    #app-root {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column;
    }

    /* 数字の等幅表示（ブレ防止） */
    .num-tabular {
      font-variant-numeric: tabular-nums;
    }

    /* UDスライダー */
    input[type=range] {
      -webkit-appearance: none; width: 100%; background: transparent; padding: 10px 0; margin: 0;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%;
      background: #ffffff; cursor: pointer; margin-top: -8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5); border: 3px solid #0ea5e9;
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 10px; cursor: pointer; background: #334155;
      border-radius: 5px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
    }
    input[type=range]:disabled::-webkit-slider-thumb {
      background: #94a3b8; border-color: #64748b; cursor: not-allowed;
    }
    input[type=range]:disabled::-webkit-slider-runnable-track {
      background: #1e293b; cursor: not-allowed;
    }

    /* スクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* P波（スカイブルー）、S波（オレンジ）のUDカラー定義 */
    .text-pwave { color: #38bdf8; } /* Tailwind sky-400 */
    .bg-pwave { background-color: #38bdf8; }
    .border-pwave { border-color: #38bdf8; }
    
    .text-swave { color: #f97316; } /* Tailwind orange-500 */
    .bg-swave { background-color: #f97316; }
    .border-swave { border-color: #f97316; }

    .highlight-sp { background-color: rgba(253, 224, 71, 0.25); } /* Yellow-300 */

    /* モーダル用 */
    .modal-overlay {
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(4px);
    }

    /* エラーシェイク */
    .shake-error { animation: shake-err 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake-err {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
  </style>
</head>
<body class="h-[100dvh] w-screen">

<div id="app-root">
  
  <!-- 合言葉モーダル -->
  <div id="auth-modal" class="hidden absolute inset-0 z-50 modal-overlay flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-600 p-6 rounded-lg shadow-2xl w-full max-w-sm">
      <h3 class="text-lg font-bold text-white mb-2"><i class="fa-solid fa-lock mr-2 text-indigo-400"></i>逆探知クイズ モード</h3>
      <p class="text-xs text-slate-300 mb-4">先生から教わった合言葉を入力してください。</p>
      <form onsubmit="handleAuth(event)">
        <input type="text" id="input-password" autocomplete="off" required class="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white mb-2 focus:outline-none focus:border-indigo-500 font-bold tracking-widest text-center" placeholder="合言葉">
        <p id="auth-error" class="text-xs text-red-400 font-bold hidden mb-4 text-center">合言葉が違います。</p>
        <div class="flex space-x-3 mt-4">
          <button type="button" id="btn-auth-cancel" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 rounded font-bold text-sm transition">キャンセル</button>
          <button type="submit" id="btn-auth-submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded font-bold text-sm transition shadow-lg shadow-indigo-900/50">ロック解除</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 p-2 flex justify-between items-center shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="w-7 h-7 rounded bg-blue-600 flex items-center justify-center shadow">
        <i class="fa-solid fa-satellite-dish text-white text-xs"></i>
      </div>
      <h1 class="text-sm md:text-base font-bold tracking-wide">地震波チェッカー</h1>
    </div>
    <!-- モード切替タブ -->
    <div class="flex bg-slate-900 rounded p-1 border border-slate-700">
      <button id="tab-normal" onclick="setMode('normal')" class="px-3 py-1 text-xs font-bold rounded bg-blue-500 text-white shadow transition">探究モード</button>
      <button id="tab-quiz" onclick="setMode('quiz')" class="px-3 py-1 text-xs font-bold rounded text-slate-400 hover:text-white transition">逆探知クイズ</button>
    </div>
  </header>

  <!-- メインレイアウト -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0">
    
    <!-- 左カラム：ビジュアルエリア（Canvasアニメ ＆ 地震計） -->
    <div class="flex-1 flex flex-col min-w-0 min-h-0 border-r border-slate-800 relative bg-[#020617]">
      
      <!-- 上段：地下断面・波のかけっこアニメーション -->
      <div class="flex-[3] relative min-h-0 border-b border-slate-700">
        <canvas id="canvas-main" class="w-full h-full block touch-none"></canvas>
        
        <!-- 凡例と速度設定表示 (クイズモード時は隠す) -->
        <div id="legend-panel" class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur border border-slate-700 p-1.5 rounded shadow text-[10px] font-bold transition-opacity">
          <div class="flex items-center space-x-2 mb-1">
            <span class="w-2 h-2 bg-pwave rounded-sm"></span><span class="text-pwave">P波 (6.0 km/s)</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 bg-swave rounded-full"></span><span class="text-swave">S波 (3.0 km/s)</span>
          </div>
        </div>
        
        <!-- タイマー表示 -->
        <div class="absolute top-2 right-2 bg-slate-900/90 border border-slate-700 px-3 py-1 rounded shadow text-center">
          <div class="text-[9px] text-slate-400">経過時間</div>
          <div class="text-xl font-bold num-tabular"><span id="display-time">0.0</span><span class="text-xs text-slate-500 ml-1">秒</span></div>
        </div>
      </div>

      <!-- 中段：リアルタイム地震計モニター -->
      <div class="flex-[2] relative min-h-0 bg-slate-900">
        <div class="absolute top-0 left-0 w-full px-2 py-1 flex justify-between items-center bg-slate-800/80 border-b border-slate-700 z-10 text-[10px] font-bold">
          <span class="text-slate-300"><i class="fa-solid fa-wave-square mr-1"></i>地震計モニター (観測地点)</span>
          <!-- クイズモード時は非表示になるSP時間表示 -->
          <span class="text-yellow-400 hidden" id="label-sp-time">初期微動継続時間: <span id="val-sp-time" class="num-tabular font-bold text-sm">--</span> 秒</span>
        </div>
        <canvas id="canvas-seismo" class="w-full h-full block touch-none"></canvas>
      </div>
      
    </div>

    <!-- 右カラム：コントロール＆データパネル -->
    <div class="w-full lg:w-[380px] flex flex-col shrink-0 min-h-0 bg-slate-800">
      
      <!-- コントロールパネル -->
      <div class="p-3 border-b border-slate-700 space-y-3 shrink-0 bg-slate-800">
        
        <!-- 距離・深さスライダー（探究モードのみ表示） -->
        <div id="control-sliders" class="space-y-3">
          <div>
            <div class="flex justify-between items-end mb-1">
              <label class="text-xs font-bold text-slate-300">震央距離 (横)</label>
              <div class="bg-slate-950 px-2 py-0.5 rounded border border-slate-700">
                <span id="val-dist" class="text-base font-bold text-white num-tabular">120</span><span class="text-[10px] text-slate-400 ml-1">km</span>
              </div>
            </div>
            <input type="range" id="range-dist" min="0" max="300" step="10" value="120">
          </div>
          <div>
            <div class="flex justify-between items-end mb-1">
              <label class="text-xs font-bold text-slate-300">震源の深さ (縦)</label>
              <div class="bg-slate-950 px-2 py-0.5 rounded border border-slate-700">
                <span id="val-depth" class="text-base font-bold text-white num-tabular">30</span><span class="text-[10px] text-slate-400 ml-1">km</span>
              </div>
            </div>
            <input type="range" id="range-depth" min="0" max="300" step="10" value="30">
          </div>
          <!-- 震源距離 (斜め) の表示 -->
          <div class="bg-yellow-900/20 border border-yellow-600/30 p-1.5 rounded flex justify-between items-center shadow-inner">
            <span class="text-[10px] font-bold text-yellow-500">震源距離 (斜めの最短距離)</span>
            <div>
              <span id="val-slant" class="text-sm font-bold text-yellow-400 num-tabular">123.7</span><span class="text-[9px] text-yellow-600 ml-1">km</span>
            </div>
          </div>
        </div>

        <!-- クイズモード時のお知らせ -->
        <div id="control-quiz" class="hidden bg-indigo-900/30 border border-indigo-500/50 p-2 rounded text-center">
          <p class="text-xs font-bold text-indigo-300 mb-1"><i class="fa-solid fa-satellite-dish mr-1"></i>謎の観測地点 X からデータ受信中</p>
          <p class="text-[10px] text-slate-300">地震計の波形からS-P時間を読み取り、<br>グラフを使って「震源距離」を当てよう！</p>
        </div>

        <!-- 制御ボタン群 -->
        <div class="flex space-x-2">
          <button id="btn-play" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded shadow transition flex items-center justify-center text-sm border border-red-500">
            <i class="fa-solid fa-play mr-1.5"></i> 地震発生
          </button>
          <button id="btn-pause" class="hidden flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded shadow transition flex items-center justify-center text-sm border border-amber-500">
            <i class="fa-solid fa-pause mr-1.5"></i> 一時停止
          </button>
          <button id="btn-reset" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-3 rounded shadow transition">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
          <div class="bg-slate-900 rounded border border-slate-700 flex p-0.5 text-xs">
            <button id="btn-spd-1" class="px-2 rounded bg-slate-700 text-white font-bold transition">x1</button>
            <button id="btn-spd-05" class="px-2 rounded text-slate-400 font-bold hover:text-white transition">x0.5</button>
          </div>
        </div>
      </div>

      <!-- データ分析エリア（スクロール可能） -->
      <div class="flex-1 overflow-y-auto no-scrollbar flex flex-col bg-slate-900 p-2 space-y-2 relative">
        
        <!-- 記録ボタン (探究モード用) -->
        <button id="btn-record" class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2 rounded shadow transition flex items-center justify-center text-sm border border-emerald-500 shrink-0">
          <i class="fa-solid fa-pen-to-square mr-1.5"></i> このデータを記録する
        </button>

        <!-- 解答入力 (クイズモード用) -->
        <div id="quiz-answer-area" class="hidden bg-slate-800 border border-slate-700 p-3 rounded shrink-0 space-y-2">
          <label class="text-xs font-bold text-slate-300">観測地点 X の「震源距離」は？</label>
          <div class="flex space-x-2">
            <div class="relative flex-1">
              <input type="number" id="input-guess" class="w-full bg-slate-950 border border-slate-600 rounded px-3 py-2 text-white num-tabular text-sm focus:outline-none focus:border-indigo-500" placeholder="数値を入力">
              <span class="absolute right-3 top-2.5 text-xs text-slate-500">km</span>
            </div>
            <button id="btn-answer" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 rounded transition text-sm">
              解答
            </button>
          </div>
          <p id="quiz-feedback" class="text-[11px] font-bold text-center hidden"></p>
        </div>

        <!-- 記録テーブル -->
        <div class="bg-slate-800 rounded border border-slate-700 flex flex-col shrink-0">
          <div class="flex justify-between items-center px-2 py-1 bg-slate-700/50 border-b border-slate-600">
            <span class="text-[10px] font-bold text-slate-300"><i class="fa-solid fa-table mr-1"></i>観測データ</span>
            <button onclick="clearData()" class="text-[9px] text-slate-400 hover:text-white px-1 border border-slate-600 rounded bg-slate-800 transition">クリア</button>
          </div>
          <table class="w-full text-center text-[10px]">
            <thead class="text-slate-400 border-b border-slate-700 bg-slate-900/50">
              <tr>
                <th class="py-1 font-normal">震源距離</th>
                <th class="py-1 font-normal text-pwave">P波(秒)</th>
                <th class="py-1 font-normal text-swave">S波(秒)</th>
                <th class="py-1 font-bold text-yellow-400">S-P時間</th>
              </tr>
            </thead>
            <tbody id="data-tbody" class="text-slate-200 num-tabular divide-y divide-slate-700/50">
              <tr><td colspan="4" class="py-2 text-slate-500">記録なし</td></tr>
            </tbody>
          </table>
        </div>

        <!-- 比例グラフ (Canvas) -->
        <div class="bg-slate-800 rounded border border-slate-700 flex flex-col flex-1 min-h-[160px]">
          <div class="px-2 py-1 bg-slate-700/50 border-b border-slate-600 text-[10px] font-bold text-slate-300">
            <i class="fa-solid fa-chart-line mr-1"></i>S-P時間と距離のグラフ
          </div>
          <div class="flex-1 relative p-1">
            <canvas id="canvas-graph" class="w-full h-full block"></canvas>
            <div id="graph-hint" class="absolute inset-0 flex items-center justify-center pointer-events-none">
              <span class="bg-slate-900/80 text-[10px] text-slate-400 px-2 py-1 rounded">データを3つ以上記録すると線が出現します</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

  // --- Constants ---
  const V_P = 6.0; // P波の速さ km/s
  const V_S = 3.0; // S波の速さ km/s
  const MAX_SLANT_DIST = 450; // km
  const MAX_TIME = 150; // sec
  const QUIZ_PASSWORD = "しんおう";
  
  const C_P = '#38bdf8'; 
  const C_S = '#f97316'; 
  
  // --- State ---
  const state = {
    mode: 'normal', // 'normal' | 'quiz'
    dist: 120, // 震央距離 (横)
    depth: 30, // 震源の深さ (縦)
    slantDist: 123.7, // 震源距離 (斜め)
    isPlaying: false,
    isPaused: false,
    speed: 1.0, 
    time: 0,
    lastTick: 0,
    animFrameId: null,
    
    seismoData: [], 
    records: [], 
    
    quizTargetDist: 0,
    isQuizSolved: false
  };

  // --- Elements ---
  const elDist = document.getElementById('range-dist');
  const elDepth = document.getElementById('range-depth');
  const valDist = document.getElementById('val-dist');
  const valDepth = document.getElementById('val-depth');
  const valSlant = document.getElementById('val-slant');
  
  const btnPlay = document.getElementById('btn-play');
  const btnPause = document.getElementById('btn-pause');
  const btnReset = document.getElementById('btn-reset');
  const btnSpd1 = document.getElementById('btn-spd-1');
  const btnSpd05 = document.getElementById('btn-spd-05');
  const btnRecord = document.getElementById('btn-record');
  
  const displayTime = document.getElementById('display-time');
  const labelSpTime = document.getElementById('label-sp-time');
  const valSpTime = document.getElementById('val-sp-time');
  const legendPanel = document.getElementById('legend-panel');
  const tbody = document.getElementById('data-tbody');
  const graphHint = document.getElementById('graph-hint');
  
  const ctrlSliders = document.getElementById('control-sliders');
  const ctrlQuiz = document.getElementById('control-quiz');
  const quizAnsArea = document.getElementById('quiz-answer-area');
  const inputGuess = document.getElementById('input-guess');
  const btnAnswer = document.getElementById('btn-answer');
  const quizFeedback = document.getElementById('quiz-feedback');

  const authModal = document.getElementById('auth-modal');
  const inputPwd = document.getElementById('input-password');
  const authError = document.getElementById('auth-error');

  const cvsMain = document.getElementById('canvas-main');
  const ctxMain = cvsMain.getContext('2d');
  const cvsSeismo = document.getElementById('canvas-seismo');
  const ctxSeismo = cvsSeismo.getContext('2d');
  const cvsGraph = document.getElementById('canvas-graph');
  const ctxGraph = cvsGraph.getContext('2d');

  // --- Initialization ---
  function init() {
    setupListeners();
    updateDistances();
    resetSim();
    resizeCanvases();
  }

  // --- Mode Switching & Authentication ---
  window.setMode = function(mode) {
    if (mode === 'quiz') {
      authModal.classList.remove('hidden');
      inputPwd.value = '';
      authError.classList.add('hidden');
      inputPwd.classList.remove('shake-error', 'border-red-500');
      // モバイルでのレイアウト崩れを防ぐためPCのみフォーカス
      setTimeout(() => { if(window.innerWidth > 768) inputPwd.focus(); }, 100);
    } else {
      applyMode('normal');
    }
  };

  document.getElementById('btn-auth-cancel').addEventListener('click', () => {
    authModal.classList.add('hidden');
  });

  window.handleAuth = function(e) {
    e.preventDefault();
    if (inputPwd.value.trim() === QUIZ_PASSWORD) {
      authModal.classList.add('hidden');
      applyMode('quiz');
    } else {
      authError.classList.remove('hidden');
      inputPwd.classList.remove('shake-error');
      void inputPwd.offsetWidth; // リフロー強制
      inputPwd.classList.add('shake-error', 'border-red-500');
    }
  };

  function applyMode(mode) {
    if (state.isPlaying) resetSim();
    state.mode = mode;
    
    const tNorm = document.getElementById('tab-normal');
    const tQuiz = document.getElementById('tab-quiz');
    
    if (mode === 'normal') {
      tNorm.className = "px-3 py-1 text-xs font-bold rounded bg-blue-500 text-white shadow transition";
      tQuiz.className = "px-3 py-1 text-xs font-bold rounded text-slate-400 hover:text-white transition";
      ctrlSliders.classList.remove('hidden');
      ctrlQuiz.classList.add('hidden');
      btnRecord.classList.remove('hidden');
      quizAnsArea.classList.add('hidden');
      legendPanel.classList.remove('hidden');
      
      updateDistances();
    } else {
      tNorm.className = "px-3 py-1 text-xs font-bold rounded text-slate-400 hover:text-white transition";
      tQuiz.className = "px-3 py-1 text-xs font-bold rounded bg-indigo-600 text-white shadow transition";
      ctrlSliders.classList.add('hidden');
      ctrlQuiz.classList.remove('hidden');
      btnRecord.classList.add('hidden');
      quizAnsArea.classList.remove('hidden');
      legendPanel.classList.add('hidden');
      
      generateQuiz();
    }
    updateTable();
    updateGraph();
    resetSim();
  }

  function generateQuiz() {
    // 30刻みでランダムな斜め距離を設定 (60〜360km)
    const options = [60, 90, 120, 150, 180, 210, 240, 270, 300, 330, 360];
    state.quizTargetDist = options[Math.floor(Math.random() * options.length)];
    state.slantDist = state.quizTargetDist; // クイズ中は斜め距離を直接指定として扱う
    state.isQuizSolved = false;
    
    inputGuess.value = '';
    quizFeedback.classList.add('hidden');
    inputGuess.disabled = false;
    btnAnswer.disabled = false;
  }

  function updateDistances() {
    if (state.mode === 'quiz') return;
    
    state.dist = parseInt(elDist.value);
    state.depth = parseInt(elDepth.value);
    
    const safeDist = Math.max(0, state.dist);
    const safeDepth = Math.max(0, state.depth);
    state.slantDist = Math.sqrt(Math.pow(safeDist, 2) + Math.pow(safeDepth, 2));
    
    valDist.innerText = state.dist;
    valDepth.innerText = state.depth;
    valSlant.innerText = state.slantDist.toFixed(1);
  }

  // --- Event Listeners ---
  function setupListeners() {
    elDist.addEventListener('input', () => {
      updateDistances();
      if (state.isPlaying) resetSim();
      drawMain();
    });

    elDepth.addEventListener('input', () => {
      updateDistances();
      if (state.isPlaying) resetSim();
      drawMain();
    });

    btnPlay.addEventListener('click', () => {
      if (!state.isPlaying) startSim();
    });

    btnPause.addEventListener('click', () => {
      state.isPaused = !state.isPaused;
      if (state.isPaused) {
        btnPause.innerHTML = '<i class="fa-solid fa-play mr-1.5"></i> 再開';
        btnPause.className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded shadow transition flex items-center justify-center text-sm border border-emerald-500";
      } else {
        btnPause.innerHTML = '<i class="fa-solid fa-pause mr-1.5"></i> 一時停止';
        btnPause.className = "flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded shadow transition flex items-center justify-center text-sm border border-amber-500";
        // 再開時に時間をワープさせないための再同期
        requestAnimationFrame((now) => {
          state.lastTick = now;
          loop(now);
        });
      }
    });

    btnReset.addEventListener('click', resetSim);

    btnSpd1.addEventListener('click', () => setSpeed(1.0));
    btnSpd05.addEventListener('click', () => setSpeed(0.5));

    btnRecord.addEventListener('click', () => {
      if (state.time === 0) return;
      
      const targetSlant = state.slantDist;
      const exactP = targetSlant / V_P;
      const exactS = targetSlant / V_S;
      const exactSP = exactS - exactP;
      
      if (!state.records.some(r => r.slant === targetSlant)) {
        state.records.push({ slant: targetSlant, p: exactP, s: exactS, sp: exactSP });
        state.records.sort((a, b) => a.slant - b.slant);
        updateTable();
        updateGraph();
      }
    });

    btnAnswer.addEventListener('click', () => {
      const guessStr = inputGuess.value.trim();
      
      // 空欄や無効入力のハンドリング
      if (guessStr === '') {
        quizFeedback.classList.remove('hidden');
        quizFeedback.innerText = "⚠ 数値を入力してください";
        quizFeedback.className = "text-[11px] font-bold text-center text-amber-400 bg-amber-900/30 p-2 rounded";
        return;
      }

      const guess = parseFloat(guessStr);
      if (isNaN(guess)) {
        quizFeedback.classList.remove('hidden');
        quizFeedback.innerText = "⚠ 正しい数値を入力してください";
        quizFeedback.className = "text-[11px] font-bold text-center text-amber-400 bg-amber-900/30 p-2 rounded";
        return;
      }
      
      quizFeedback.classList.remove('hidden');
      if (guess === state.quizTargetDist) {
        quizFeedback.innerText = "🎉 正解！波形から正確に距離を導き出せました！";
        quizFeedback.className = "text-[11px] font-bold text-center text-emerald-400 bg-emerald-900/30 p-2 rounded border border-emerald-500/50";
        state.isQuizSolved = true;
        inputGuess.disabled = true;
        btnAnswer.disabled = true;
        
        // 正解したらグラフにプロット
        const targetSlant = state.quizTargetDist;
        const exactP = targetSlant / V_P;
        const exactS = targetSlant / V_S;
        
        if (!state.records.some(r => r.slant === targetSlant)) {
          state.records.push({ slant: targetSlant, p: exactP, s: exactS, sp: exactS - exactP });
          state.records.sort((a, b) => a.slant - b.slant);
        }
        updateTable();
        updateGraph();
        drawMain(); // 断面図のハテナ表示を解除
      } else {
        quizFeedback.innerText = "❌ 違うみたいだ。S-P時間をもう一度よく測って、グラフの直線(y=6x)から計算してみよう。";
        quizFeedback.className = "text-[11px] font-bold text-center text-red-400 bg-red-900/30 p-2 rounded border border-red-500/50";
      }
    });
  }

  function setSpeed(spd) {
    state.speed = spd;
    if (spd === 1.0) {
      btnSpd1.className = "px-2 rounded bg-slate-700 text-white font-bold transition";
      btnSpd05.className = "px-2 rounded text-slate-400 font-bold hover:text-white transition";
    } else {
      btnSpd05.className = "px-2 rounded bg-slate-700 text-white font-bold transition";
      btnSpd1.className = "px-2 rounded text-slate-400 font-bold hover:text-white transition";
    }
  }

  window.clearData = function() {
    state.records = [];
    updateTable();
    updateGraph();
  };

  // --- Simulation Control ---
  function startSim() {
    state.isPlaying = true;
    state.isPaused = false;
    state.time = 0;
    state.seismoData = [];
    
    elDist.disabled = true;
    elDepth.disabled = true;
    btnPlay.classList.add('hidden');
    btnPause.classList.remove('hidden');
    btnPause.innerHTML = '<i class="fa-solid fa-pause mr-1.5"></i> 一時停止';
    btnPause.className = "flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded shadow transition flex items-center justify-center text-sm border border-amber-500";
    
    labelSpTime.classList.add('hidden');
    
    requestAnimationFrame((now) => {
      state.lastTick = now;
      state.animFrameId = requestAnimationFrame(loop);
    });
  }

  function resetSim() {
    state.isPlaying = false;
    state.isPaused = false;
    state.time = 0;
    state.seismoData = [];
    cancelAnimationFrame(state.animFrameId);
    
    elDist.disabled = false;
    elDepth.disabled = false;
    btnPlay.classList.remove('hidden');
    btnPause.classList.add('hidden');
    
    displayTime.innerText = "0.0";
    labelSpTime.classList.add('hidden');
    
    drawMain();
    drawSeismo();
  }

  function loop(now) {
    if (!state.isPlaying || state.isPaused) return;

    // タブ切り替え等でのタイムワープを防ぐためのデルタタイム上限設定 (0.1秒)
    let dtReal = (now - state.lastTick) / 1000;
    if (dtReal > 0.1) dtReal = 0.1; 
    
    const dtSim = dtReal * 10 * state.speed; 
    state.time += dtSim;
    state.lastTick = now;

    generateSeismoData();
    checkArrivals();

    drawMain();
    drawSeismo();

    const endTime = (state.slantDist / V_S) + 20; 
    if (state.time > Math.min(endTime, MAX_TIME)) {
      state.time = Math.min(endTime, MAX_TIME);
      drawMain();
      drawSeismo();
      state.isPlaying = false;
      btnPlay.classList.remove('hidden');
      btnPause.classList.add('hidden');
      elDist.disabled = false;
      elDepth.disabled = false;
      return;
    }

    state.animFrameId = requestAnimationFrame(loop);
  }

  function generateSeismoData() {
    const t = state.time;
    const tP = state.slantDist / V_P;
    const tS = state.slantDist / V_S;
    
    let amp = 0;
    if (t < tP) {
      amp = (Math.random() - 0.5) * 0.5;
    } else if (t >= tP && t < tS) {
      amp = (Math.random() - 0.5) * 8; 
    } else {
      const decay = Math.max(0, 1 - (t - tS) / 15);
      amp = (Math.random() - 0.5) * 30 * decay; 
      if (amp === 0) amp = (Math.random() - 0.5) * 1; 
    }
    
    state.seismoData.push({ t: t, amp: amp });
  }

  function checkArrivals() {
    const safeSlantDist = Math.max(0.1, state.slantDist);
    const tP = safeSlantDist / V_P;
    const tS = safeSlantDist / V_S;
    
    displayTime.innerText = state.time.toFixed(1);
    
    // カンニング防止：クイズ中はS-P時間を表示させない
    if (state.mode === 'quiz') {
      labelSpTime.classList.add('hidden');
      return;
    }
    
    if (state.time >= tS) {
      labelSpTime.classList.remove('hidden');
      valSpTime.innerText = (tS - tP).toFixed(1);
    } else if (state.time >= tP) {
      labelSpTime.classList.remove('hidden');
      valSpTime.innerText = (state.time - tP).toFixed(1);
    }
  }

  // --- Rendering Functions ---
  function resizeCanvases() {
    const dpr = window.devicePixelRatio || 1;
    
    [cvsMain, cvsSeismo, cvsGraph].forEach(cvs => {
      if (!cvs || !cvs.parentElement) return;
      const rect = cvs.parentElement.getBoundingClientRect();
      if (rect.width < 10 || rect.height < 10) return; // 画面回転時の幅0エラー防止
      cvs.width = rect.width * dpr;
      cvs.height = rect.height * dpr;
      const ctx = cvs.getContext('2d');
      ctx.scale(dpr, dpr);
    });
    
    drawMain();
    drawSeismo();
    updateGraph();
  }

  window.addEventListener('resize', () => {
    clearTimeout(state.resizeTimer);
    state.resizeTimer = setTimeout(resizeCanvases, 100);
  });

  // 【上段】地下断面図・波のかけっこ
  function drawMain() {
    const w = cvsMain.width / window.devicePixelRatio;
    const h = cvsMain.height / window.devicePixelRatio;
    const ctx = ctxMain;
    
    if (w < 10 || h < 10) return;
    ctx.clearRect(0, 0, w, h);

    // クイズモード（未正解時）のレーダー画面
    if (state.mode === 'quiz' && !state.isQuizSolved) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);
      
      ctx.fillStyle = '#818cf8'; // indigo-400
      ctx.font = 'bold 16px BIZ UDPGothic';
      ctx.textAlign = 'center';
      ctx.fillText('📡 謎の観測地点X のデータを受信中...', w/2, h/2 - 15);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px BIZ UDPGothic';
      ctx.fillText('下の「地震計モニター」の波形だけを頼りに', w/2, h/2 + 20);
      ctx.fillText('震源距離を割り出せ！', w/2, h/2 + 40);
      
      ctx.fillStyle = 'rgba(99, 102, 241, 0.1)';
      ctx.beginPath(); ctx.arc(w/2, h/2, 100 + Math.sin(Date.now()/300)*10, 0, Math.PI*2); ctx.fill();
      
      if (state.isPlaying) {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 12px BIZ UDPGothic';
        ctx.fillText(`記録中... ${state.time.toFixed(1)}s`, w/2, h - 20);
      }
      return;
    }

    // --- 探究モード（またはクイズ正解後）の断面図描画 ---
    const padX = 30;
    const padY = 40;
    const drawW = w - padX * 2;
    const drawH = h - padY * 2;
    
    // スケール計算 (震央最大300, 深さ最大300)
    const scale = Math.min(drawW / 300, drawH / 300); 
    const originX = padX;
    const originY = padY; // 地表

    // 地表ライン
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(w, originY); ctx.stroke();

    // 震央ライン
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX, h); ctx.stroke();

    // グリッド線
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#1e293b';
    for(let d=0; d<=300; d+=50) {
      const x = originX + d * scale;
      ctx.beginPath(); ctx.moveTo(x, originY); ctx.lineTo(x, h); ctx.stroke();
      if (d % 100 === 0) {
        ctx.fillStyle = '#64748b'; ctx.font = '10px BIZ UDPGothic'; ctx.textAlign = 'center';
        ctx.fillText(`${d}km`, x, originY - 10);
      }
      const y = originY + d * scale;
      ctx.beginPath(); ctx.moveTo(originX, y); ctx.lineTo(w, y); ctx.stroke();
      if (d > 0 && d % 100 === 0) {
        ctx.fillStyle = '#64748b'; ctx.textAlign = 'right';
        ctx.fillText(`深さ${d}km`, originX - 5, y + 3);
      }
    }

    const hypX = originX;
    const hypY = originY + state.depth * scale;
    const targetX = originX + (state.mode === 'quiz' ? state.quizTargetDist : state.dist) * scale;
    const targetY = originY;

    // 斜めのひも
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hypX, hypY);
    ctx.lineTo(targetX, targetY);
    ctx.stroke();

    // 震源アイコン
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(hypX, hypY, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ef4444'; ctx.textAlign = 'right'; ctx.font = 'bold 12px BIZ UDPGothic';
    ctx.fillText('震源', hypX - 8, hypY + 4);

    // 観測地点（学校）
    let sX = targetX;
    let sY = targetY - 15;
    if (state.isPlaying && !state.isPaused) {
      const safeSlantDist = Math.max(0.1, state.slantDist);
      const tP = safeSlantDist / V_P;
      const tS = safeSlantDist / V_S;
      if (state.time >= tS) {
        sX += (Math.random()-0.5)*4; sY += (Math.random()-0.5)*4; 
      } else if (state.time >= tP) {
        sX += (Math.random()-0.5)*1.5; sY += (Math.random()-0.5)*1.5; 
      }
    }
    
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('🏫', sX, sY);
    
    const midX = (hypX + targetX) / 2;
    const midY = (hypY + targetY) / 2;
    ctx.fillStyle = '#eab308'; // yellow-500
    ctx.font = 'bold 10px BIZ UDPGothic';
    ctx.fillText(`斜め ${state.slantDist.toFixed(1)}km`, midX, midY - 10);
    
    ctx.fillStyle = '#eab308';
    ctx.beginPath(); ctx.arc(targetX, targetY, 4, 0, Math.PI*2); ctx.fill();

    // 波の進行描画
    if (state.time > 0) {
      const dP = Math.min(state.time * V_P, MAX_SLANT_DIST);
      const dS = Math.min(state.time * V_S, MAX_SLANT_DIST);
      
      const angle = Math.atan2(targetY - hypY, targetX - hypX);
      
      const px = hypX + Math.cos(angle) * dP * scale;
      const py = hypY + Math.sin(angle) * dP * scale;
      
      const sx = hypX + Math.cos(angle) * dS * scale;
      const sy = hypY + Math.sin(angle) * dS * scale;

      ctx.beginPath();
      ctx.arc(hypX, hypY, dP * scale, -Math.PI/2, Math.PI/2); 
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)'; ctx.lineWidth = 2; ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(hypX, hypY, dS * scale, -Math.PI/2, Math.PI/2);
      ctx.strokeStyle = 'rgba(249, 115, 22, 0.4)'; ctx.lineWidth = 3; ctx.stroke();

      ctx.fillStyle = C_P;
      ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Orbitron'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
      ctx.fillText('P', px, py);

      ctx.fillStyle = C_S;
      ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Orbitron'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
      ctx.fillText('S', sx, sy);

      if (dP > dS) {
        ctx.strokeStyle = 'rgba(253, 224, 71, 0.3)'; // yellow
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(px, py); ctx.stroke();
      }
    }
  }

  // 【中段】地震計の描画
  function drawSeismo() {
    const w = cvsSeismo.width / window.devicePixelRatio;
    const h = cvsSeismo.height / window.devicePixelRatio;
    const ctx = ctxSeismo;
    
    if (w < 10 || h < 10) return;
    ctx.clearRect(0, 0, w, h);

    const padX = 30;
    const padY = 20;
    const drawW = w - padX * 2;
    const drawH = h - padY * 2;
    
    const scaleX = drawW / MAX_TIME; 
    const originX = padX;
    const originY = h / 2;

    ctx.lineWidth = 1;
    for(let t=0; t<=MAX_TIME; t+=10) {
      const x = originX + t * scaleX;
      ctx.strokeStyle = (t % 20 === 0) ? '#334155' : '#1e293b';
      ctx.beginPath(); ctx.moveTo(x, padY); ctx.lineTo(x, h - padY); ctx.stroke();
      if (t % 20 === 0) {
        ctx.fillStyle = '#64748b'; ctx.font = '9px BIZ UDPGothic'; ctx.textAlign = 'center';
        ctx.fillText(`${t}s`, x, h - 5);
      }
    }

    const tP = state.slantDist / V_P;
    const tS = state.slantDist / V_S;
    
    if (state.time > tP) {
      const endT = Math.min(state.time, tS);
      const hX = originX + tP * scaleX;
      const hW = (endT - tP) * scaleX;
      ctx.fillStyle = 'rgba(253, 224, 71, 0.15)';
      ctx.fillRect(hX, padY, hW, drawH);
    }

    if (state.time >= tP) {
      const px = originX + tP * scaleX;
      ctx.strokeStyle = C_P; ctx.beginPath(); ctx.moveTo(px, padY); ctx.lineTo(px, h-padY); ctx.stroke();
      ctx.fillStyle = C_P; ctx.fillText('P', px, padY - 5);
    }
    if (state.time >= tS) {
      const sx = originX + tS * scaleX;
      ctx.strokeStyle = C_S; ctx.beginPath(); ctx.moveTo(sx, padY); ctx.lineTo(sx, h-padY); ctx.stroke();
      ctx.fillStyle = C_S; ctx.fillText('S', sx, padY - 5);
    }

    ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX + drawW, originY); ctx.stroke();

    if (state.seismoData.length > 0) {
      ctx.strokeStyle = '#10b981'; // emerald-500
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      
      for(let i=0; i<state.seismoData.length; i++) {
        const d = state.seismoData[i];
        if (d.t > MAX_TIME) break;
        const x = originX + d.t * scaleX;
        const y = Math.max(padY, Math.min(h - padY, originY + d.amp));
        ctx.lineTo(x, y);
      }
      ctx.stroke();

      const last = state.seismoData[state.seismoData.length - 1];
      if (last && last.t <= MAX_TIME) {
        const lx = originX + last.t * scaleX;
        const ly = Math.max(padY, Math.min(h - padY, originY + last.amp));
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(lx, ly, 2, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  // --- Data Table & Graph ---
  function updateTable() {
    if (state.records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="py-2 text-slate-500 text-[10px]">記録なし</td></tr>';
      graphHint.classList.remove('hidden');
      return;
    }
    
    graphHint.classList.add('hidden');
    tbody.innerHTML = state.records.map(r => `
      <tr class="hover:bg-slate-700/50 transition border-b border-slate-700/30">
        <td class="py-1.5 text-yellow-400">${r.slant.toFixed(1)}</td>
        <td class="py-1.5 text-pwave">${r.p.toFixed(1)}</td>
        <td class="py-1.5 text-swave">${r.s.toFixed(1)}</td>
        <td class="py-1.5 text-yellow-400 font-bold">${r.sp.toFixed(1)}</td>
      </tr>
    `).join('');
  }

  function updateGraph() {
    const w = cvsGraph.width / window.devicePixelRatio;
    const h = cvsGraph.height / window.devicePixelRatio;
    const ctx = ctxGraph;
    
    if (w < 10 || h < 10) return;
    ctx.clearRect(0, 0, w, h);

    const padL = 30, padR = 10, padT = 10, padB = 20;
    const drawW = w - padL - padR;
    const drawH = h - padT - padB;
    
    const maxX = 80; 
    const maxY = 450; 

    const originX = padL;
    const originY = h - padB;

    function getPt(sp, dist) {
      return {
        x: originX + (sp / maxX) * drawW,
        y: originY - (dist / maxY) * drawH
      };
    }

    ctx.lineWidth = 1;
    ctx.fillStyle = '#64748b'; ctx.font = '9px BIZ UDPGothic';
    
    for(let d=0; d<=maxY; d+=100) {
      const pt = getPt(0, d);
      ctx.strokeStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x + drawW, pt.y); ctx.stroke();
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(d, pt.x - 4, pt.y);
    }
    
    ctx.strokeStyle = '#475569';
    ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX + drawW, originY); ctx.stroke(); 
    ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX, originY - drawH); ctx.stroke(); 

    if (state.records.length >= 3) {
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.4)'; // yellow
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      const p0 = getPt(0, 0);
      const pMax = getPt(75, 450); 
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(pMax.x, pMax.y);
      ctx.stroke();
      ctx.setLineDash([]);
      
      ctx.fillStyle = '#fde047'; ctx.font = '10px BIZ UDPGothic'; ctx.textAlign = 'left';
      ctx.fillText('震源距離 = 6 × S-P時間', p0.x + 10, padT + 10);
    }

    state.records.forEach(r => {
      const pt = getPt(r.sp, r.slant);
      const isQuizAns = (state.mode === 'quiz' && r.slant === state.quizTargetDist);
      ctx.fillStyle = isQuizAns ? '#a855f7' : '#10b981'; 
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    });
  }

  init();
});
</script>
</body>
</html>
